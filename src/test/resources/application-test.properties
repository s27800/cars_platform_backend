# Test profile configuration
spring.application.name=cars_platform_backend

# H2 in-memory database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable open in view warning
spring.jpa.open-in-view=false

# JWT configuration for tests
app.jwt.secret=TestSecretKeyForJwtTokenGenerationInTestEnvironmentMustBeLongEnoughForHS512
app.jwt.expiration-in-ms=3600000

# CORS and login attempt limit for tests
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.security.login.max-attempts=5
app.security.login.lockout-minutes=15
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# Disable swagger in tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging configuration for tests
logging.level.org.springframework.security=DEBUG
logging.level.com.carsplatform.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG
